<!DOCTYPE html>
<!-- 作者：李南诺 | 建立时间：2026-11-04 | 使用大模型：GLM-5.3-Flash | 功能名称：新浪排行榜练习入口页（进入 sina-rank.html / 返回课程总首页） -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>练习入口 —— 新浪排行榜选项卡</title>
<style>
  :root {
    --LNN_sinaBlue: #1E4FA2;
    --LNN_sinaBorder: #C6CBD4;
    --LNN_sinaText: #333333;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #FFFFFF;
    color: var(--LNN_sinaText);
    font-family: "Microsoft YaHei", "PingFang SC", SimSun, sans-serif;
    font-size: 16px;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 入口卡片 */
  .LNN_entryCard {
    width: 460px;
    max-width: calc(100% - 40px);
    border: 1px solid var(--LNN_sinaBorder);
    border-radius: 10px;
    padding: 44px 40px 36px;
    text-align: center;
    box-shadow: 0 16px 40px -30px rgba(30,79,162,.5);
  }
  .LNN_entryTitle {
    font-size: 30px;
    font-weight: 700;
    color: var(--LNN_sinaBlue);
    letter-spacing: 3px;
  }
  .LNN_entrySub {
    margin-top: 14px;
    font-size: 14.5px;
    color: rgba(51,51,51,.72);
    line-height: 1.9;
  }
  .LNN_enterBtn {
    display: inline-block;
    margin-top: 30px;
    padding: 12px 46px;
    background: var(--LNN_sinaBlue);
    color: #FFFFFF;
    font-size: 16.5px;
    letter-spacing: 4px;
    text-decoration: none;
    border-radius: 6px;
    transition: background .18s ease;
  }
  .LNN_enterBtn:hover { background: #173D85; }
  .LNN_enterBtn:focus-visible { outline: 2px solid var(--LNN_sinaBlue); outline-offset: 3px; }
  .LNN_homeBack {
    display: block;
    margin-top: 26px;
    font-size: 13.5px;
  }
  .LNN_homeBack a {
    color: var(--LNN_sinaBlue);
    text-decoration: none;
    border-bottom: 1px solid rgba(30,79,162,.4);
    padding-bottom: 1px;
  }
  .LNN_homeBack a:hover { border-bottom-color: var(--LNN_sinaBlue); }
  .LNN_homeBack a:focus-visible { outline: 2px solid var(--LNN_sinaBlue); outline-offset: 3px; }
</style>
</head>
<body>

  <main class="LNN_entryCard">
    <h1 class="LNN_entryTitle">新浪排行榜</h1>
    <p class="LNN_entrySub">Tab 选项卡练习 · 1:1 还原设计图<br>选项卡：新闻 / 证券 / 理财 / 博客（新闻默认选中）</p>
    <a class="LNN_enterBtn" href="sina-rank.html">进入排行榜</a>
    <span class="LNN_homeBack"><a href="../index.html">回到课程总首页</a></span>
  </main>

</body>
</html>
