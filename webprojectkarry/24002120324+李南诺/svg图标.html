<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>svg图标</title>
  <script src="https://at.alicdn.com/t/c/font_5231894_47qyyzrltbj.js"></script>
  <link rel="stylesheet" href="./svg图标.css">
  <style>
    .icon {
      width: 1em;
      height: 1em;
      vertical-align: -0.15em;
      fill: currentColor;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <h3>SVG图标</h3>
  <div class="tab-nav">
    <div class="tab-item" onclick="changeTab(this)">
   <svg class="icon" aria-hidden="true">
    <use xlink:href="#icon-shouye"></use>
   </svg>
<span>首页</span> 
<!--div.budge-dot回车-->
<!--红点-->
<div class="budge-dog" id="budge-home"></div>
    </div>
  
    <div class="tab-item" onclick="changeTab(this)">
      <svg class="icon" aria-hidden="true">
        <use xlink:href="#icon-xinzeng"></use>
      </svg>
<span>计划</span>
<!--数字红点-->
<div class="budge-num" id="budge-plan">6</div>
    </div>
    
    <div class="tab-item" onclick="changeTab(this)">
      <svg class="icon" aria-hidden="true">
        <use xlink:href="#icon-baocun"></use>
      </svg>
<span>收藏</span>
<div class="budge-border" id="budge-collect"></div>
    </div>
    
    <div class="tab-item" onclick="changeTab(this)">
      <svg class="icon" aria-hidden="true">
        <use xlink:href="#icon-shouye"></use>
      </svg>
<span>安排</span>
<div class="budge-num max" id="budge-my">100+</div>
    </div>
    
  </div>
  <script>
    //获取全部tab标签
    //写一个函数，当我点击当天的item时候，颜色发生变化
    function changeTab(current) {
      //1.先把所有导航取消active
      let tabs = document.querySelectorAll('.tab-item');
      for (let i = 0; i < tabs.length; i++) {
        tabs[i].classList.remove('active');
      }
      //2.给当前点击的item添加active高亮
      current.classList.add('active');
    }
  </script>
</body>
</html>
